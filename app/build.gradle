plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.example.batteryinfo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.batteryinfo'
        minSdk 26
        targetSdk 36 
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            // proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
        debug {
            minifyEnabled = false
        }
    }

    buildFeatures {
        // ✅ Tetap true tidak masalah, tapi di MainActivity kita pakai findViewById
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // 🔥 WAJIB DITAMBAHKAN: Untuk fungsi enableEdgeToEdge() di MainActivity
    // Tanpa ini, Android 16 app akan error saat compile.
    implementation 'androidx.activity:activity-ktx:1.9.0'
}
